      - name: Instalar bibliotecas
        run: |
          haxelib setup ~/haxelib
          haxelib install lime 7.9.0
          haxelib install openfl 9.1.0
          haxelib install flixel 4.11.0
          haxelib install flixel-addons 2.11.0
          haxelib install flixel-ui 2.4.0
          haxelib install actuate
          haxelib install hscript
          haxelib install newgrounds
          haxelib install hxcpp
          # instala qualquer biblioteca do Project.xml que ainda esteja faltando
          grep -oP '<haxelib name="\K[^"]+' Project.xml | sort -u | while read lib; do
            haxelib path "$lib" > /dev/null 2>&1 || haxelib install "$lib" --always || true
          done
          haxelib run lime setup -alias -y
          haxelib list
